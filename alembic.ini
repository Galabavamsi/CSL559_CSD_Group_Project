# Alembic (database migrations, task 1.7). The database is the app's own: DARKSTORE_DB, read in migrations/env.py.
#   python -m alembic revision --autogenerate -m "what changed"     after editing app/models.py
#   python -m alembic upgrade head                                   apply it (the app also does this when it starts)
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s
