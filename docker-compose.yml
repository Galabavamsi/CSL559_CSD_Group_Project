services:
  app:
    build: .
    ports: ["${APP_PORT:-8000}:8000"]
    env_file:                    # server settings (JWT_SECRET and the rest): copy deploy.env.example to deploy.env
      - path: deploy.env         # and start with `docker compose --env-file deploy.env up -d --build` (docs/DEPLOY_AWS.md)
        required: false
    environment:
      # PostgreSQL with PostGIS: the bundled `postgres` service by default, or the URL of a hosted database
      # (for example Amazon RDS, which has PostGIS); nothing else changes.
      DARKSTORE_DB: ${DARKSTORE_DB:-postgresql://darkstore:${POSTGRES_PASSWORD:-darkstore}@postgres:5432/darkstore}
      RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-20}   # 0 for a load test (it is one client)
    depends_on:
      postgres:
        condition: service_healthy
  postgres:                      # the database: PostgreSQL 16 with PostGIS
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: darkstore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-darkstore}   # the default is for local development only
      POSTGRES_DB: darkstore
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:5432:5432"]          # this machine only; the app reaches it as postgres:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darkstore"]
      interval: 5s
      timeout: 5s
      retries: 10
  prometheus:                    # task 4.7: `docker compose --profile monitoring up --build`
    image: prom/prometheus:v2.53.0
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9090:9090"]          # this machine only
    depends_on: [app]
  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["monitoring"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # viewers need no login; editing still needs admin
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}   # local development only
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/darkstore.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]          # this machine only
    depends_on: [prometheus]
volumes:
  pgdata: {}
