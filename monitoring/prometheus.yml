# Prometheus for the prototype (HLD 12): scrape the app's /metrics and evaluate the alert rules.
# Started by `docker compose --profile monitoring up`; the UI is at http://localhost:9090.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files: ["/etc/prometheus/alerts.yml"]

scrape_configs:
  - job_name: darkstore
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
