name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:                        # PostgreSQL with PostGIS is the only database the app runs on
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: darkstore
          POSTGRES_PASSWORD: darkstore       # a throwaway database inside the CI job
          POSTGRES_DB: darkstore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U darkstore" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DARKSTORE_DB: postgresql://darkstore:darkstore@localhost:5432/darkstore
      DARKSTORE_TEST_DB: postgresql://darkstore:darkstore@localhost:5432/darkstore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Migrations build exactly the tables in models.py
        run: python -m alembic upgrade head && python -m alembic check
      - run: python -m pytest -q
